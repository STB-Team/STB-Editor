# Push a tag v<version> → build the portable zip with package.ps1 and publish a GitHub release.
# Release notes: the "## <version>" section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Package
        shell: pwsh
        run: ./package.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))

      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $match = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "STB Editor $version" }
          $notes += "`n`nInstallation: extract the archive to any folder and run STBEditor.exe (.NET is included)."
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" "dist/STBEditor-$version.zip" --title "STB Editor $version" --notes-file release-notes.md
